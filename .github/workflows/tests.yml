name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test tools on all samples
        run: |
          python tools/eml_analyzer.py samples/*.eml > /dev/null
          python tools/build_timeline.py --email samples/case01_credential_harvest.eml --logs samples/case01_*.csv > /dev/null
